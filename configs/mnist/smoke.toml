# Tiny synthetic execution test; this does not establish MNIST behavior.
[experiment]
seed = 20260828
output_dir = "runs/mnist_smoke"
dtype = "float64"
device = "cpu"
threads = 1

[dataset]
kind = "synthetic"
per_class = 8
input_dim = 6
seed = 709
center = true

[model]
hidden_widths = [8, 6]
initialization = "torch_default"
layer_scale = 0.1

[optimizer]
learning_rate = 0.003
beta1 = 0.9
beta2 = 0.99
beta_policy = "fixed"

[run]
max_steps = 8
target_loss = 1e-20
resume = true

[logging]
record_every = 2
coordinate_every = 2
expensive_every = 4
coordinate_count = 2
selection_loss = 1.0
spectral_norm_steps = 4
nuclear_norm_steps = 6
checkpoint_every = 2
checkpoint_every_seconds = 0.0
progress_every = 0
sketch_dimension = 8
log_second_moment_shadow = true
log_incoming_every_step = true
full_checkpoint_losses = [1.0]

[[schedules]]
name = "p025"
power = 0.25
