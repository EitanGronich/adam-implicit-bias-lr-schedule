# Historical MNIST architecture: 784 -> 1024 -> 1024 -> 1, no biases.
# Paths resolve relative to the working directory; download is opt-in.
[experiment]
seed = 20260828
output_dir = "runs/mnist_three_layer_eta7e4"
dtype = "float64"
device = "auto"
threads = 8

[dataset]
kind = "mnist"
data_dir = "data"
per_class = 512
center = true
download = false

[model]
hidden_widths = [1024, 1024]
initialization = "torch_default"
layer_scale = 0.01

[optimizer]
learning_rate = 0.0003
beta1 = 0.9
beta2 = 0.999
beta_policy = "fixed"

[run]
max_steps = 200000
target_loss = 1e-20
stop_at_target = true
resume = true

[logging]
record_every = 100
coordinate_every = 1000
expensive_every = 5000
checkpoint_every = 10000
checkpoint_every_seconds = 600.0
progress_every = 2500
coordinate_count = 100
selection_loss = 0.1
log_second_moment_shadow = false
log_incoming_every_step = false
full_checkpoint_losses = [1e-4, 1e-8, 1e-12, 1e-16, 1e-20]

[sweep]
seeds = [20260828, 20260829, 20260830]
beta2_values = [0.9, 0.99, 0.999]

[[schedules]]
name = "p000_eta7e4"
power = 0.0
learning_rate = 0.0007
max_steps = 100000

[[schedules]]
name = "p010_eta7e4"
power = 0.1
learning_rate = 0.0007
max_steps = 150000

[[schedules]]
name = "p025_eta7e4"
power = 0.25
learning_rate = 0.0007
max_steps = 250000

[[schedules]]
name = "p050_eta7e4"
power = 0.5
learning_rate = 0.0007
max_steps = 500000

[[schedules]]
name = "p075_eta7e4"
power = 0.75
learning_rate = 0.0007
max_steps = 1000000
