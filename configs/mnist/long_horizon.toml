# Bias-free MNIST with small initialization and epsilon zero.
[experiment]
seed = 2026100901
output_dir = "runs/long_horizon"
dtype = "float64"
device = "auto"
threads = 2

[dataset]
kind = "mnist"
data_dir = "data"
per_class = 512
center = true
download = false

[model]
hidden_widths = [512, 512]
bias = false
initialization = "torch_default"
layer_scale = 0.0001

[optimizer]
learning_rate = 0.0003
beta1 = 0.9
beta2 = 0.999
epsilon = 0.0

[run]
# Operational safety limit. A capped run is incomplete until loss <= 1e-20.
max_steps = 10000000
target_loss = 1e-20
stop_at_target = true
resume = true

[logging]
trace_buffer_rows = 1024
checkpoint_every = 10000
checkpoint_every_seconds = 600.0
progress_every = 2500
full_checkpoint_losses = [1e-4, 1e-6, 1e-8, 1e-10, 1e-12, 1e-14, 1e-16, 1e-18, 1e-19, 1e-20]

[sweep]
seeds = [2026100901, 2026100902, 2026100903, 2026100904, 2026100905]
beta2_values = [0.999]

[[schedules]]
name = "alpha_0_eta3e4"
alpha = 0.0
learning_rate = 0.0003

[[schedules]]
name = "alpha_neg0p10_eta3e4"
alpha = -0.1
learning_rate = 0.0003

[[schedules]]
name = "alpha_neg0p30_eta3e4"
alpha = -0.3
learning_rate = 0.0003

[[schedules]]
name = "alpha_neg0p50_eta3e4"
alpha = -0.5
learning_rate = 0.0003

[[schedules]]
name = "alpha_neg0p70_eta3e4"
alpha = -0.7
learning_rate = 0.0003
