# Quick real-Adam smoke experiment: no downloads or generated/synthetic formulas.
[model]
layers = 3
B = 2.0
C = 1.0
M = 128.0

[initialization]
rho = 1.0
sampling = "grid"
grid_size = 3
sample_count = 16
seed = 0
s_min = 0.0
s_max = 14.556090791758852
ell_min = -1.65
ell_max = 1.65
sectors = "both"
max_trajectories = 100000

[optimizer]
beta1 = 0.9
beta2 = 0.999
epsilon = 0.0

[schedule]
initial_rate = 0.01
power = 0.0

[run]
steps = 100
dtype = "float64"
device = "cpu"
threads = 1
output_dir = "runs/directional/smoke"

[logging]
every = 25
geometric_checkpoints = 12
progress_every = 0
plots = true
plot_trajectories = 8

[numerics]
stop_on_subnormal = true
support_margin_cap = 250.0
stagnation_patience = 0
