# Example configurable depth and power schedule: L=4, 128 paired random controls.
[model]
layers = 4
B = 2.0
C = 1.0
M = 128.0

[initialization]
rho = 1.0
sampling = "random"
grid_size = 3
sample_count = 128
seed = 123
s_min = 0.0
s_max = 14.556090791758852
ell_min = -1.0
ell_max = 1.0
sectors = "both"
max_trajectories = 100000

[optimizer]
beta1 = 0.9
beta2 = 0.999
epsilon = 0.0

[schedule]
initial_rate = 0.01
power = 0.25

[run]
steps = 10000
dtype = "float64"
device = "cpu"
threads = 1
output_dir = "runs/directional/l4_power025"

[logging]
every = 1000
geometric_checkpoints = 40
progress_every = 5000
plots = true
plot_trajectories = 12

[numerics]
stop_on_subnormal = true
support_margin_cap = 250.0
stagnation_patience = 0
